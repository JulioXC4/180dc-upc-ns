name: CI & Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Essential Files
        run: |
          echo "Checking essential web assets..."
          test -f index.html || { echo "Missing index.html"; exit 1; }
          test -f styles.css || { echo "Missing styles.css"; exit 1; }
          test -f script.js || { echo "Missing script.js"; exit 1; }
          test -f assets/favicon.png || { echo "Missing favicon"; exit 1; }
          test -f assets/og-image.jpg || { echo "Missing og-image"; exit 1; }
          echo "All core assets present."

      - name: Syntax Check JavaScript
        run: |
          node -c script.js
          echo "JavaScript syntax check passed."
